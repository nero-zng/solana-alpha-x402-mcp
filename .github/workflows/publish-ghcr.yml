name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - '.github/workflows/publish-ghcr.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nero-zng/solana-alpha-x402-mcp:latest
            ghcr.io/nero-zng/solana-alpha-x402-mcp:${{ steps.ver.outputs.version }}
          labels: |
            io.modelcontextprotocol.server.name=io.github.nero-zng/solana-alpha-x402-mcp
            org.opencontainers.image.source=https://github.com/nero-zng/solana-alpha-x402-mcp
